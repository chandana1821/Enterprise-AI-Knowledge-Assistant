services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: knowbase
      POSTGRES_USER: knowbase
      POSTGRES_PASSWORD: knowbase
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./backend/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowbase -d knowbase"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://knowbase:knowbase@db:5432/knowbase
    ports: ["8000:8000"]
    volumes: ["./backend/uploads:/app/uploads"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
